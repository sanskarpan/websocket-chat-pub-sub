<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#484f58"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1f6feb"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#da3633"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="900" height="460" fill="#0d1117" rx="14"/>
  <rect x="1" y="1" width="898" height="458" fill="none" stroke="#21262d" stroke-width="1" rx="13"/>

  <!-- title bar dots -->
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#28c840"/>
  <text x="450" y="27" fill="#8b949e" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">ws-chat — distributed architecture</text>

  <!-- Client -->
  <rect x="330" y="52" width="240" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="450" y="73" fill="#f0f6fc" font-size="12.5" text-anchor="middle" font-weight="700">Browser / Mobile Client</text>
  <text x="450" y="91" fill="#8b949e" font-size="10.5" text-anchor="middle">REST  ·  WebSocket</text>

  <!-- client → LB -->
  <line x1="450" y1="104" x2="450" y2="128" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4 2"/>

  <!-- Load Balancer -->
  <rect x="290" y="128" width="320" height="52" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="450" y="150" fill="#3fb950" font-size="12.5" text-anchor="middle" font-weight="700">Load Balancer</text>
  <text x="450" y="167" fill="#8b949e" font-size="10.5" text-anchor="middle">Nginx / Traefik  ·  TLS termination</text>

  <!-- LB → REST -->
  <line x1="340" y1="180" x2="140" y2="236" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- LB → WS1 -->
  <line x1="420" y1="180" x2="357" y2="236" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- LB → WS2 -->
  <line x1="460" y1="180" x2="516" y2="236" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- LB → WS3 -->
  <line x1="520" y1="180" x2="678" y2="236" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- REST API -->
  <rect x="30" y="236" width="200" height="60" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="130" y="258" fill="#58a6ff" font-size="12.5" text-anchor="middle" font-weight="700">REST API</text>
  <text x="130" y="273" fill="#8b949e" font-size="10" text-anchor="middle">Gin  ·  :8085</text>
  <text x="130" y="287" fill="#8b949e" font-size="10" text-anchor="middle">Auth · Rooms · Messages</text>

  <!-- WS Pod 1 -->
  <rect x="262" y="236" width="156" height="60" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <text x="340" y="258" fill="#3fb950" font-size="11.5" text-anchor="middle" font-weight="700">WS Hub · Pod 1</text>
  <text x="340" y="273" fill="#8b949e" font-size="10" text-anchor="middle">gorilla/websocket</text>
  <text x="340" y="287" fill="#8b949e" font-size="10" text-anchor="middle">:8086</text>

  <!-- WS Pod 2 -->
  <rect x="436" y="236" width="156" height="60" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <text x="514" y="258" fill="#3fb950" font-size="11.5" text-anchor="middle" font-weight="700">WS Hub · Pod 2</text>
  <text x="514" y="273" fill="#8b949e" font-size="10" text-anchor="middle">gorilla/websocket</text>
  <text x="514" y="287" fill="#8b949e" font-size="10" text-anchor="middle">:8086</text>

  <!-- WS Pod 3 -->
  <rect x="610" y="236" width="156" height="60" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <text x="688" y="258" fill="#3fb950" font-size="11.5" text-anchor="middle" font-weight="700">WS Hub · Pod 3</text>
  <text x="688" y="273" fill="#8b949e" font-size="10" text-anchor="middle">gorilla/websocket</text>
  <text x="688" y="287" fill="#8b949e" font-size="10" text-anchor="middle">:8086</text>

  <!-- WS pods ↔ Redis (pubsub fanout lines) -->
  <line x1="340" y1="296" x2="420" y2="362" stroke="#da3633" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="420" y1="368" x2="340" y2="302" stroke="#da3633" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <line x1="514" y1="296" x2="480" y2="362" stroke="#da3633" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="480" y1="368" x2="514" y2="302" stroke="#da3633" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <line x1="688" y1="296" x2="546" y2="362" stroke="#da3633" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="546" y1="368" x2="688" y2="302" stroke="#da3633" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- REST ↔ PostgreSQL -->
  <line x1="130" y1="296" x2="130" y2="362" stroke="#6e40c9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- REST → Redis (rate limit / cache) -->
  <line x1="230" y1="270" x2="390" y2="375" stroke="#484f58" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr)"/>

  <!-- WS → PostgreSQL -->
  <line x1="262" y1="280" x2="200" y2="340" stroke="#484f58" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr)"/>

  <!-- Redis -->
  <rect x="390" y="362" width="210" height="60" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
  <text x="495" y="385" fill="#ff7b72" font-size="12.5" text-anchor="middle" font-weight="700">Redis</text>
  <text x="495" y="400" fill="#8b949e" font-size="10" text-anchor="middle">Pub/Sub  ·  Cache  ·  Rate Limit</text>
  <text x="495" y="414" fill="#8b949e" font-size="10" text-anchor="middle">Blacklist  ·  Dedup</text>

  <!-- PostgreSQL -->
  <rect x="30" y="362" width="200" height="60" rx="8" fill="#161b22" stroke="#6e40c9" stroke-width="1.5"/>
  <text x="130" y="385" fill="#d2a8ff" font-size="12.5" text-anchor="middle" font-weight="700">PostgreSQL</text>
  <text x="130" y="400" fill="#8b949e" font-size="10" text-anchor="middle">pgx/v5  ·  Snowflake IDs</text>
  <text x="130" y="414" fill="#8b949e" font-size="10" text-anchor="middle">Users  ·  Rooms  ·  Messages</text>

  <!-- Metrics box -->
  <rect x="660" y="362" width="210" height="60" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="765" y="385" fill="#8b949e" font-size="12.5" text-anchor="middle" font-weight="700">Prometheus</text>
  <text x="765" y="400" fill="#8b949e" font-size="10" text-anchor="middle">:9090/metrics</text>
  <text x="765" y="414" fill="#8b949e" font-size="10" text-anchor="middle">Scraped from all pods</text>

  <!-- Pub/Sub label -->
  <rect x="352" y="310" width="125" height="20" rx="4" fill="#21262d"/>
  <text x="414" y="324" fill="#da3633" font-size="9.5" text-anchor="middle" font-weight="600">← Pub/Sub fanout →</text>

  <!-- legend -->
  <rect x="680" y="140" width="200" height="84" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="780" y="158" fill="#8b949e" font-size="10" text-anchor="middle" font-weight="600">Legend</text>
  <line x1="696" y1="170" x2="716" y2="170" stroke="#2ea043" stroke-width="2"/>
  <text x="724" y="174" fill="#8b949e" font-size="10">Load balancer</text>
  <line x1="696" y1="186" x2="716" y2="186" stroke="#1f6feb" stroke-width="2"/>
  <text x="724" y="190" fill="#8b949e" font-size="10">REST API</text>
  <line x1="696" y1="202" x2="716" y2="202" stroke="#238636" stroke-width="2"/>
  <text x="724" y="206" fill="#8b949e" font-size="10">WebSocket pods</text>
  <line x1="696" y1="218" x2="716" y2="218" stroke="#da3633" stroke-width="2"/>
  <text x="724" y="222" fill="#8b949e" font-size="10">Redis (Pub/Sub)</text>
</svg>
